services:
  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: gym-postgres-db
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Server (Service Discovery)
  eureka-server:
    build:
      context: ./EurikaServer
      dockerfile: Dockerfile
    container_name: gym-eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Training Microservice (Report Service)
  training-microservice:
    build:
      context: ./TrainingMicroservice
      dockerfile: Dockerfile.with-integrations
    container_name: gym-training-microservice
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - EUREKA_CLIENT_ENABLED=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SERVER_PORT=8081
    depends_on:
      - eureka-server
    networks:
      - gym-network

  # Main Service (Gym-Spring-Boot)
  main-service:
    build:
      context: ./Gym-Spring-Boot
      dockerfile: Dockerfile.with-integrations
    container_name: gym-main-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_ENABLED=true
      - SPRING_CLOUD_DISCOVERY_ENABLED=true
      - SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/gym
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SERVER_PORT=8080
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      training-microservice:
        condition: service_started
    networks:
      - gym-network

volumes:
  postgres-data:
    driver: local

networks:
  gym-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

